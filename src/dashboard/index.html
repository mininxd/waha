<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAHA Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>WAHA Dashboard</h1>
            <button id="settings-btn" class="btn btn-icon" title="Settings"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main class="container">
        <div id="sessions" class="sessions-grid">
            <!-- Sessions will be loaded here -->
            <div class="loading">Loading sessions...</div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Settings</h2>
            <div class="form-group">
                <label for="api-key">API Key (X-Api-Key)</label>
                <input type="password" id="api-key" placeholder="Enter your API Key">
                <small>Leave empty if no API Key is configured.</small>
            </div>
            <button id="save-settings" class="btn btn-primary">Save</button>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal hidden">
        <div class="modal-content text-center">
            <span class="close-modal">&times;</span>
            <h2>Scan QR Code</h2>
            <div id="qr-container" class="qr-container">
                <!-- QR code image will be here -->
            </div>
            <p>Scan this code with WhatsApp on your phone.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
